name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build the package
        run: make build

      - name: Run the test suite
        run: scripts/test-suite.sh

      - name: Build the shipping bundle and check the version
        run: |
          set -euo pipefail
          make app VERSION=0.0.0-ci
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Fluor.app/Contents/Info.plist)
          echo "CFBundleShortVersionString: $version"
          if [ "$version" != "0.0.0-ci" ]; then
            echo "::error::the bundle should report 0.0.0-ci, but it reports $version"
            exit 1
          fi
          codesign --verify --deep --strict dist/Fluor.app
          echo 'codesign --verify --deep --strict dist/Fluor.app succeeded.'

      - name: Build the Intel bundle and check the architecture
        run: |
          set -euo pipefail
          make app-intel VERSION=0.0.0-ci
          archs=$(lipo -archs dist/Fluor-x86_64.app/Contents/MacOS/Fluor)
          echo "lipo -archs: $archs"
          if [ "$archs" != "x86_64" ]; then
            echo "::error::the Intel bundle should hold an x86_64 binary, but it holds $archs"
            exit 1
          fi

      - name: Build the release artifacts and check the checksum
        run: |
          set -euo pipefail
          make release-artifacts VERSION=0.0.0-ci
          lines=$(wc -l < release/checksums.txt | tr -d ' ')
          if [ "$lines" != "1" ]; then
            echo "::error::release/checksums.txt should hold one line, but it holds $lines"
            exit 1
          fi
          line=$(cat release/checksums.txt)
          if ! printf '%s\n' "$line" | grep -Eq '^[0-9a-f]{64}  Fluor\.dmg$'; then
            echo "::error::unexpected checksum line: $line"
            exit 1
          fi
          recorded=$(printf '%s\n' "$line" | cut -d' ' -f1)
          digest=$(shasum -a 256 release/Fluor.dmg | cut -d' ' -f1)
          echo "release/checksums.txt: $line"
          echo "shasum -a 256 release/Fluor.dmg: $digest  Fluor.dmg"
          if [ "$recorded" != "$digest" ]; then
            echo "::error::the checksum file records $recorded, but the disk image hashes to $digest"
            exit 1
          fi

      - name: Remove the build products
        run: make clean
