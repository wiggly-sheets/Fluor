name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build the package
        run: make build

      - name: Run the test suite
        run: make test

      - name: Build the shipping bundle
        run: make app VERSION=0.0.0-ci

      - name: Verify the bundle
        run: make verify VERSION=0.0.0-ci

      - name: Build the Intel bundle and check the architecture
        run: |
          set -euo pipefail
          make app-intel VERSION=0.0.0-ci
          archs=$(lipo -archs dist/Fluor-x86_64.app/Contents/MacOS/Fluor)
          echo "lipo -archs: $archs"
          if [ "$archs" != "x86_64" ]; then
            echo "::error::the Intel bundle should hold an x86_64 binary, but it holds $archs"
            exit 1
          fi

      # release-artifacts writes the checksum file and verifies it.
      - name: Build the release artifacts
        run: make release-artifacts VERSION=0.0.0-ci

      - name: Remove the build products
        run: make clean
