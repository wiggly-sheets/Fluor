name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, for example 2.8.0.'
        required: true
        type: string
      draft:
        description: 'Publish the release as a draft.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Build and publish the release
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Fetch the branches of the repository
        run: |
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git remote set-head origin -a

      - name: Resolve the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::the version \"$version\" is not valid"
            exit 1
          fi
          echo "The release builds version $version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether the release is a draft
        id: draft
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *-*) draft=true ;;
            *) draft=false ;;
          esac
          if [ "$INPUT_DRAFT" = "true" ]; then
            draft=true
          fi
          echo "The release is a draft: $draft."
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - name: Prepare the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release.sh "$VERSION"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            release/Fluor.dmg
            release/checksums.txt
            release-notes.md
          body_path: release-notes.md
          draft: ${{ steps.draft.outputs.draft }}
          generate_release_notes: false
          fail_on_unmatched_files: true
