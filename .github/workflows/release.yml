name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build and publish the release
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Resolve the version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::the version \"$version\" is not valid"
            exit 1
          fi
          echo "The release builds version $version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The tag must sit on the default branch
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::the tag ${GITHUB_REF_NAME} is not on origin/main; cut it from the default branch"
            exit 1
          fi

      - name: Run the test suite
        run: make test

      - name: Build the release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make release-artifacts VERSION="$VERSION"

      - name: Verify the bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make verify VERSION="$VERSION"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/changelog.sh notes "$VERSION" > release-notes.md
          {
            echo ""
            echo "## Checksums"
            echo ""
            echo '```'
            cat release/checksums.txt
            echo '```'
          } >> release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Fluor ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/Fluor.dmg
            release/checksums.txt
            release-notes.md
          fail_on_unmatched_files: true
